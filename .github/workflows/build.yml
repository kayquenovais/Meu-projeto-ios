name: Gerar IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar para iPhone
        run: |
          xcodebuild \
            -project ProxyKeyApp.xcodeproj \
            -scheme ProxyKeyApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Criar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ProxyKeyApp.app Payload/
          zip -r ProxyKeyApp-unsigned.ipa Payload

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProxyKeyApp-IPA
          path: ProxyKeyApp-unsigned.ipa
