workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Verificar projeto
        script: |
          xcodebuild -list \
            -project "$CM_BUILD_DIR/projeto.xcodeproj"

      - name: Gerar IPA
          script: |
              xcode-project build-ipa --project "$CM_BUILD_DIR/projeto.xcodeproj" --scheme "ProxyKeyApp"
            
            artifacts:
               - build/ios/ipa/*.ipa
            
            
            

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
