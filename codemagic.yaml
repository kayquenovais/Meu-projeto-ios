workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Verificar projeto
        script: |
          xcodebuild -list \
            -project "$CM_BUILD_DIR/projeto.xcodeproj"

      - name: Compilar aplicativo iOS
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/projeto.xcodeproj" \
            -scheme "projeto" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
